<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="darkreader-lock">
    <title>Retro Timetable - Rich Text Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        /* TRASPARENZA PER NOTION */
        html, body {
            margin: 0; padding: 20px;
            background-color: transparent !important;
            font-family: 'VT323', monospace;
            display: flex; justify-content: center; align-items: start;
            min-height: 100vh;
        }

        :root {
            --win-frame: #A03050;      
            --title-bg: linear-gradient(to bottom, #FFDDEE 0%, #F4AABF 100%);
            --sys-bg: #F0BBD0;         
            --cell-bg: #FFF0F5;        
            --header-bg: #EBA8BB;
            --border-color: #000000;
        }

        .window {
            width: 100%; max-width: 800px;
            background-color: var(--sys-bg);
            border: 3px solid var(--win-frame);
            border-radius: 8px 8px 0 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            display: flex; flex-direction: column;
            position: relative;
        }

        .title-bar {
            height: 30px; padding: 0 8px;
            background: var(--title-bg);
            border-bottom: 1px solid var(--win-frame);
            display: flex; align-items: center; justify-content: center;
            border-radius: 5px 5px 0 0;
        }

        .title-text {
            font-family: Arial, sans-serif;
            font-size: 14px; font-weight: bold;
        }

        /* TABELLA TIMETABLE */
        table {
            width: 100%; border-collapse: collapse;
            background-color: var(--border-color);
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 10px;
            min-height: 50px;
            background-color: var(--cell-bg);
            color: #000;
            font-size: 18px;
            vertical-align: top;
        }

        th {
            background-color: var(--header-bg);
            text-transform: uppercase;
            font-size: 20px;
        }

        /* Celle modificabili */
        .editable {
            outline: none;
            min-height: 40px;
            transition: background 0.2s;
        }

        .editable:focus {
            background-color: #fff;
        }

        /* BARRA DI FORMATTAZIONE FLUTTUANTE */
        .floating-toolbar {
            display: none;
            position: absolute;
            background-color: #222;
            border-radius: 6px;
            padding: 5px 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            z-index: 9999;
            gap: 5px;
            align-items: center;
        }

        .floating-toolbar.active { display: flex; }

        .floating-toolbar button {
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 14px;
            padding: 5px 8px;
            border-radius: 4px;
            font-family: sans-serif;
        }

        .floating-toolbar button:hover { background: #444; }
        
        .divider { width: 1px; height: 15px; background: #666; margin: 0 2px; }

    </style>
</head>
<body>

    <div class="window" id="timetable-window">
        <div class="title-bar">
            <div class="title-text">MY WEEKLY TIMETABLE</div>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>Ora</th>
                    <th>Lunedì</th>
                    <th>Martedì</th>
                    <th>Mercoledì</th>
                </tr>
            </thead>
            <tbody id="timetable-body">
                <tr>
                    <td>09:00</td>
                    <td class="editable" contenteditable="true" id="cell-1-1"></td>
                    <td class="editable" contenteditable="true" id="cell-1-2"></td>
                    <td class="editable" contenteditable="true" id="cell-1-3"></td>
                </tr>
                <tr>
                    <td>11:00</td>
                    <td class="editable" contenteditable="true" id="cell-2-1"></td>
                    <td class="editable" contenteditable="true" id="cell-2-2"></td>
                    <td class="editable" contenteditable="true" id="cell-2-3"></td>
                </tr>
                <tr>
                    <td>14:00</td>
                    <td class="editable" contenteditable="true" id="cell-3-1"></td>
                    <td class="editable" contenteditable="true" id="cell-3-2"></td>
                    <td class="editable" contenteditable="true" id="cell-3-3"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <div id="floating-toolbar" class="floating-toolbar">
        <button onmousedown="event.preventDefault(); format('bold')"><b>B</b></button>
        <button onmousedown="event.preventDefault(); format('italic')"><i>I</i></button>
        <button onmousedown="event.preventDefault(); format('underline')"><u>U</u></button>
        <div class="divider"></div>
        <button onmousedown="event.preventDefault(); format('hiliteColor', '#ffff00')">🖍️</button>
        <button onmousedown="event.preventDefault(); format('removeFormat')">✕</button>
    </div>

    <script>
        const toolbar = document.getElementById('floating-toolbar');
        const cells = document.querySelectorAll('.editable');

        // --- FUNZIONE FORMATTAZIONE ---
        function format(command, value = null) {
            document.execCommand(command, false, value);
            saveData(); // Salva dopo la formattazione
        }

        // --- LOGICA MENÙ FLUTTUANTE ---
        document.addEventListener('selectionchange', () => {
            const selection = window.getSelection();
            const text = selection.toString().trim();

            if (text.length > 0) {
                const range = selection.getRangeAt(0);
                // Controlla se la selezione è dentro una cella modificabile
                const container = range.commonAncestorContainer.parentElement;
                
                if (container && container.closest('.editable')) {
                    const rect = range.getBoundingClientRect();
                    
                    toolbar.style.display = 'flex';
                    toolbar.classList.add('active');
                    
                    // Posizionamento: sopra il testo selezionato
                    toolbar.style.top = `${rect.top + window.scrollY - 45}px`;
                    toolbar.style.left = `${rect.left + window.scrollX + (rect.width / 2) - (toolbar.offsetWidth / 2)}px`;
                    return;
                }
            }
            toolbar.classList.remove('active');
            toolbar.style.display = 'none';
        });

        // --- SALVATAGGIO AUTOMATICO ---
        function saveData() {
            const data = {};
            cells.forEach(cell => {
                data[cell.id] = cell.innerHTML;
            });
            localStorage.setItem('notion-timetable-rich', JSON.stringify(data));
        }

        function loadData() {
            const saved = localStorage.getItem('notion-timetable-rich');
            if (saved) {
                const data = JSON.parse(saved);
                cells.forEach(cell => {
                    if (data[cell.id]) cell.innerHTML = data[cell.id];
                });
            }
        }

        cells.forEach(cell => {
            cell.addEventListener('input', saveData);
        });

        window.onload = loadData;
    </script>
</body>
</html>
